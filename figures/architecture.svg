<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b75"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="14" fill="#ffffff"/>

  <!-- input -->
  <rect x="24" y="225" width="150" height="110" rx="10" fill="#eef1f3" stroke="#8fa3ad"/>
  <text x="99" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2428">Dashcam clip</text>
  <text x="99" y="282" text-anchor="middle" font-size="13" fill="#2e3a42">1164 x 874, 20 Hz</text>
  <text x="99" y="302" text-anchor="middle" font-size="13" fill="#2e3a42">frames around t</text>
  <path d="M174 260 C 200 260, 200 130, 226 130" fill="none" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <path d="M174 300 C 200 300, 200 430, 226 430" fill="none" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>

  <!-- top-down branch -->
  <text x="230" y="52" font-size="13" font-weight="700" fill="#b07a0a" letter-spacing="1.5">TOP-DOWN BRANCH</text>
  <rect x="228" y="70" width="160" height="120" rx="10" fill="#fdf3dd" stroke="#e8a317"/>
  <text x="308" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">Bird's-eye warp</text>
  <text x="308" y="124" text-anchor="middle" font-size="13" fill="#2e3a42">17 RGB frames</text>
  <text x="308" y="144" text-anchor="middle" font-size="13" fill="#2e3a42">t-8 ... t+8</text>
  <text x="308" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#b07a0a">51 x 192 x 96</text>
  <line x1="388" y1="130" x2="420" y2="130" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <rect x="422" y="70" width="210" height="120" rx="10" fill="#fdf3dd" stroke="#e8a317"/>
  <text x="527" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">ConvNeXt-Tiny</text>
  <text x="527" y="122" text-anchor="middle" font-size="13" fill="#2e3a42">ImageNet-1k, 27.9 M params</text>
  <text x="527" y="144" text-anchor="middle" font-size="13" fill="#2e3a42">stage 4: 768 x 6 x 3</text>
  <text x="527" y="170" text-anchor="middle" font-size="13" fill="#2e3a42">pool + FC -&gt; speed</text>
  <line x1="632" y1="130" x2="664" y2="130" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <rect x="666" y="80" width="150" height="100" rx="10" fill="#ffffff" stroke="#e8a317" stroke-dasharray="5 4"/>
  <text x="741" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">12-model ensemble</text>
  <text x="741" y="132" text-anchor="middle" font-size="13" fill="#2e3a42">+ stride-2 TTA</text>
  <text x="741" y="152" text-anchor="middle" font-size="13" fill="#2e3a42">below 55 km/h</text>

  <!-- front-view branch -->
  <text x="230" y="352" font-size="13" font-weight="700" fill="#3d5a6c" letter-spacing="1.5">FRONT-VIEW BRANCH</text>
  <rect x="228" y="370" width="160" height="120" rx="10" fill="#e6eef3" stroke="#5b8aa6"/>
  <text x="308" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">Greyscale frame</text>
  <text x="308" y="424" text-anchor="middle" font-size="13" fill="#2e3a42">5 frames 0.1 s apart</text>
  <text x="308" y="444" text-anchor="middle" font-size="13" fill="#2e3a42">+ 5 differences</text>
  <text x="308" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#3d5a6c">10 x 144 x 256</text>
  <line x1="388" y1="430" x2="420" y2="430" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <rect x="422" y="370" width="210" height="120" rx="10" fill="#e6eef3" stroke="#5b8aa6"/>
  <text x="527" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">ConvNeXt-Nano</text>
  <text x="527" y="422" text-anchor="middle" font-size="13" fill="#2e3a42">ImageNet-12k, 15.0 M params</text>
  <text x="527" y="444" text-anchor="middle" font-size="13" fill="#2e3a42">stage 4: 640 x 4 x 8</text>
  <text x="527" y="470" text-anchor="middle" font-size="13" fill="#2e3a42">pool + FC -&gt; speed</text>
  <line x1="632" y1="430" x2="664" y2="430" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <rect x="666" y="380" width="150" height="100" rx="10" fill="#ffffff" stroke="#5b8aa6" stroke-dasharray="5 4"/>
  <text x="741" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2428">5-model ensemble</text>
  <text x="741" y="432" text-anchor="middle" font-size="13" fill="#2e3a42">+ frame-gap TTA</text>
  <text x="741" y="452" text-anchor="middle" font-size="13" fill="#2e3a42">and flip</text>

  <!-- fusion -->
  <path d="M816 130 C 845 130, 845 255, 872 255" fill="none" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <path d="M816 430 C 845 430, 845 305, 872 305" fill="none" stroke="#5b6b75" stroke-width="2" marker-end="url(#a)"/>
  <rect x="874" y="200" width="200" height="160" rx="10" fill="#1f2428"/>
  <text x="974" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#e8a317">Speed blend</text>
  <text x="974" y="254" text-anchor="middle" font-size="12.5" fill="#eef1f3">front view near standstill,</text>
  <text x="974" y="272" text-anchor="middle" font-size="12.5" fill="#eef1f3">50/50 mix at speed</text>
  <text x="974" y="300" text-anchor="middle" font-size="12.5" fill="#eef1f3">41-frame median + mean</text>
  <text x="974" y="318" text-anchor="middle" font-size="12.5" fill="#eef1f3">minus OOF bias 0.586</text>
  <text x="974" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">speed (km/h)</text>

  <text x="550" y="535" text-anchor="middle" font-size="13" fill="#5b6b75">Test RMSE 1.212 km/h on 8 held-out drives (9,600 frames)</text>
</svg>
